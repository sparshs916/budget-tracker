line-length = 130

[lint]
select = ["E", "F", "W"]

[lint.per-file-ignores]
# The merchant keyword table reads best one category per line.
"budget/categorize.py" = ["E501"]
# Bank-export fixtures are copied verbatim.
"tests/test_budget.py" = ["E501"]
# The frozen-math fixture reads best one row per line.
"tests/test_golden.py" = ["E501"]
# Reuses the conn fixture from test_features (pytest injects it by name).
"tests/test_tools.py" = ["F811", "E501"]
